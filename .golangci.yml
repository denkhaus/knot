version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - nakedret
    - gocritic
    - goconst
    - funlen

linters-settings:
  funlen:
    lines: 120
    statements: 50

formatters:
  enable:
    - gofmt