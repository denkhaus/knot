version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - gocritic
    - gocyclo
    - revive
    - goconst
    - funlen

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    enabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
    settings:
      dupl: false
  funlen:
    lines: 500
    statements: 100
  maintainidx:
    target: 15

formatters:
  enable:
    - gofmt

issues:
  exclude-rules:
    - path: "internal/.*test.*\\.go$"
    - path: ".*_test\\.go$"
    - path: "coverage/.*\\.go$"
    - path: "magefiles/.*\\.go$"
  max-issues-per-linter: 0
  max-same-issues: 3